<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Emotion - 고양이 감정 분석</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    :root {
      --paper: #F6F1EA;
      --ink: #2A2536;
      --ink-soft: #6B6478;
      --mauve: #B96A8C;
      --violet: #7A5FB0;
      --apricot: #F0A860;
      --sage: #6FAE93;
      --danger: #D9695E;
      --line: #E4DBD0;
      --card: #FFFFFF;
      --shadow: 0 10px 30px rgba(42, 37, 54, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: radial-gradient(1200px 700px at 20% -10%, #efe6f5 0%, transparent 55%),
        radial-gradient(1000px 600px at 100% 110%, #f6e6d8 0%, transparent 55%), #eae3ec;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 28px 12px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .device {
      width: 393px;
      height: 852px;
      position: relative;
      flex: 0 0 auto;
      background: linear-gradient(145deg, #d9d2c6, #b9b1a6);
      border-radius: 56px;
      padding: 11px;
      box-shadow: 0 40px 80px rgba(30, 25, 45, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.25);
    }

    .device::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 53px;
      box-shadow: inset 0 0 0 2px rgba(120, 110, 100, 0.55);
      pointer-events: none;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--paper);
      border-radius: 46px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 36px;
      background: #0c0b10;
      border-radius: 20px;
      z-index: 60;
    }

    .statusbar {
      height: 54px;
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 30px 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      z-index: 40;
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 138px;
      height: 5px;
      border-radius: 3px;
      background: rgba(20, 15, 30, 0.28);
      z-index: 60;
    }

    .app {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .language-selector {
      display: flex;
      gap: 6px;
      padding: 8px 22px;
      flex: 0 0 auto;
    }

    .lang-btn {
      flex: 1;
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 10px;
      padding: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink-soft);
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--violet);
      border-color: var(--violet);
      color: #fff;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      padding: 0 22px;
      flex: 0 0 auto;
    }

    .tab-button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-soft);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-button.active {
      color: var(--violet);
      border-bottom-color: var(--violet);
    }

    .view {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 22px 78px;
      display: none;
    }

    .view.active {
      display: flex;
      flex-direction: column;
    }

    .view::-webkit-scrollbar {
      width: 0;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 8px;
      letter-spacing: -0.02em;
    }

    .sub {
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 6px 0 2px;
    }

    .brand .logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(140deg, var(--violet), var(--mauve));
      position: relative;
      flex: 0 0 auto;
      box-shadow: var(--shadow);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .brand .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand b {
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .brand span {
      font-size: 10px;
      color: #9a90a8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid #f0ebe3;
      margin-bottom: 12px;
    }

    label.fld {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      margin: 10px 0 6px;
    }

    input[type=text], input[type=number], select, textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 12px;
      padding: 11px;
      font-size: 14px;
      color: var(--ink);
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s;
      resize: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--violet);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink-soft);
      transition: all 0.15s;
    }

    .chip.on {
      background: var(--violet);
      border-color: var(--violet);
      color: #fff;
      box-shadow: 0 6px 14px rgba(122, 95, 176, 0.32);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: -0.01em;
      margin-top: 12px;
    }

    .btn.primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 12px 24px rgba(42, 37, 54, 0.28);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .catcard {
      background: linear-gradient(150deg, #2f2842, #4a3a63);
      color: #fff;
      border-radius: 16px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 36px rgba(47, 40, 66, 0.35);
      margin-bottom: 12px;
    }

    .catcard .nm {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .catcard .meta {
      font-size: 12px;
      opacity: 0.82;
      margin-top: 4px;
    }

    input[type='file'] {
      display: none;
    }

    .upload-box {
      border: 2px dashed var(--line);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .upload-box:hover {
      border-color: var(--violet);
      background: rgba(122, 95, 176, 0.05);
    }

    .upload-box .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .upload-box .text {
      color: var(--ink-soft);
      font-size: 12px;
    }

    .preview-img {
      width: 100%;
      max-height: 260px;
      border-radius: 14px;
      margin-bottom: 12px;
      object-fit: cover;
    }

    .emotion-result {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid #f0ebe3;
      margin-bottom: 12px;
    }

    .emotion-emoji {
      font-size: 48px;
      text-align: center;
      margin: 8px 0;
    }

    .response-text {
      background: rgba(122, 95, 176, 0.1);
      border-left: 3px solid var(--violet);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.8;
      margin: 12px 0;
      font-weight: 500;
      max-height: 280px;
      overflow-y: auto;
    }

    .detection-info {
      background: rgba(122, 95, 176, 0.1);
      border: 1px solid rgba(122, 95, 176, 0.2);
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 16px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--line);
      border-top-color: var(--violet);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    canvas {
      display: none;
    }

    .model-status {
      font-size: 11px;
      color: var(--ink-soft);
      padding: 8px;
      text-align: center;
      margin-bottom: 10px;
    }

    .model-status.ready {
      color: var(--sage);
    }

    .sound-btn {
      padding: 10px;
      font-size: 13px;
      margin-top: 8px;
    }

    .char-count {
      font-size: 10px;
      color: var(--ink-soft);
      text-align: right;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="device">
      <div class="screen">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span>●●●●●</span>
        </div>

        <div class="app">
          <div class="language-selector">
            <button class="lang-btn active" data-lang="ko">한국어 🇰🇷</button>
            <button class="lang-btn" data-lang="ja">日本語 🇯🇵</button>
            <button class="lang-btn" data-lang="es">Español 🇪🇸</button>
          </div>

          <div class="tabs">
            <button class="tab-button active" data-tab="profile">프로필</button>
            <button class="tab-button" data-tab="analyze">분석</button>
          </div>

          <!-- 프로필 탭 -->
          <div class="view active" id="profile-view">
            <div class="brand" style="margin-bottom: 14px;">
              <div class="logo" id="logoUpload" onclick="document.getElementById('catPhoto').click()" title="클릭해서 사진 업로드">🐱</div>
              <div>
                <b>Cat Emotion</b>
                <span>My Cat</span>
              </div>
              <input type="file" id="catPhoto" accept="image/*" style="display:none;">
            </div>

            <h1>고양이 프로필</h1>
            <p class="sub">고양이 정보를 등록해주세요</p>

            <div class="card">
              <label class="fld">이름 *</label>
              <input type="text" id="catName" placeholder="예: 미미, 루루">

              <label class="fld">나이</label>
              <input type="number" id="catAge" placeholder="예: 3" min="0" max="30">

              <label class="fld">성별</label>
              <div class="chips">
                <div class="chip" data-gender="M">수컷 🐱</div>
                <div class="chip" data-gender="F">암컷 🐱</div>
              </div>

              <label class="fld">성격 선택</label>
              <div class="chips">
                <div class="chip" data-personality="활발함">🚀 활발함</div>
                <div class="chip" data-personality="도도함">😼 도도함</div>
                <div class="chip" data-personality="까칠함">😾 까칠함</div>
                <div class="chip" data-personality="느긋함">😸 느긋함</div>
                <div class="chip" data-personality="장난스러움">🎾 장난</div>
                <div class="chip" data-personality="사려깊음">🧠 사려깊음</div>
                <div class="chip" data-personality="겁많음">😿 겁많음</div>
                <div class="chip" data-personality="다정함">💕 다정함</div>
                <div class="chip" data-personality="고집쟁이">💪 고집쟁이</div>
                <div class="chip" data-personality="쾌활함">😄 쾌활함</div>
              </div>

              <label class="fld">추가 정보</label>
              <textarea id="catInfo" placeholder="특징이나 습관..." style="height: 70px;"></textarea>
            </div>

            <button class="btn primary" onclick="saveProfile()">프로필 저장</button>
            <div id="profileStatus"></div>
          </div>

          <!-- 분석 탭 -->
          <div class="view" id="analyze-view">
            <div class="brand">
              <div class="logo">🐱</div>
              <div>
                <b id="analyzeCatName">고양이</b>
                <span>감정 분석</span>
              </div>
            </div>

            <div id="modelStatus" class="model-status">모델 로딩 중...</div>

            <div class="catcard" id="welcomeCard">
              <div class="nm">🐱 안녕!</div>
              <div class="meta">사진을 올려보세요</div>
            </div>

            <label class="upload-box" onclick="document.getElementById('analyzePhoto').click()">
              <div class="icon">📸</div>
              <div class="text">사진 선택</div>
              <input type="file" id="analyzePhoto" accept="image/*">
            </label>

            <div id="analyzePreview"></div>

            <div class="emotion-result" id="results" style="display: none;">
              <div class="emotion-emoji" id="emotionEmoji">😸</div>
              <div id="detectionInfo" class="detection-info"></div>
              <div class="response-text" id="responseText"></div>
              <div class="char-count" id="charCount"></div>
              <button class="btn primary sound-btn" onclick="speakResponse()">🔊 다시 듣기</button>
            </div>
          </div>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <!-- 모듈 로드 -->
  <script src="js/profile-manager.js"></script>
  <script src="js/yolo-detector.js"></script>

  <script>

    let lastResponse = '';
    let currentLang = 'ko';

          happy: ['음... 나쁘진 않네 흠... 괜찮긴 한데... 뭐 그럴 수도 있지 음... 좋다고 할 수 있겠네 흠흠... 나쁘지 않습니다 근데 다음엔 더 잘하셈! 이 정도면 괜찮지만 완벽하진 않아!! 그냥 뭐... 괜찮은 것 같긴 한데... 좋은 날씨네... 아니지 그건 상관없고... 음... 그렇구나...'],
          anxious: ['뭐하는 거야? 귀찮아.. 흐음... 싫어 불안하네... 뭔가 계획이 있었는데?! 좀 불편해 음... 뭔가 마음에 안 드네 정신 차려!! 뭐하는 건데?! 흠... 불편해... 싫어!! 좀 정신 차려!! 뭐하는 거예요?! 가만히 있던 내를 움직이게 하지 말아!!!'],
          tired: ['모르겠어... 지겨워 피곤하니까 가 컹... 조용히 해 지쳤어... 나 혼자 있고 싶어 피곤하니까 건드리지 말아!! 아 정신 없어... 지겨워ㅠ 누구 없나? 혼자 있고 싶은데!! 흠... 피곤해 약간 짜증나네... 모르겠어... 그냥 가...'],
          angry: ['뭐야!! 슈슉!! 슈슉!! 이 무례한!! 화났다!!! 진짜 화났어!! 물려줄거야!! 접근하지 마!! 이 정도론 모자랐나?! 정말 나쁜데요... 아주!!! 화났어요!! 건드리면 진짜 물어!! 싫어!! 물린다고!!! 피하지 못하게 해줄 거야!!']
        }
      },
      ja: {},
      es: {}
    };

    // 언어 버튼
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
      });
    });

    // 칩 선택
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('on');
      });
    });

    // 탭 전환
    document.querySelectorAll('.tab-button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabName = btn.dataset.tab;
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`${tabName}-view`).classList.add('active');
      });
    });

    // 프로필 저장
    async function saveProfile() {
      const name = document.getElementById('catName').value.trim();
      if (!name) {
        alert('고양이 이름을 입력해주세요');
        return;
      }

      const genderChip = document.querySelector('[data-gender].on');
      const personalityChips = Array.from(document.querySelectorAll('[data-personality].on'));

      const profile = {
        name,
        age: document.getElementById('catAge').value || '',
        gender: genderChip?.dataset.gender || '',
        personalities: personalityChips.map(c => c.dataset.personality),
        info: document.getElementById('catInfo').value,
        photo: document.getElementById('logoUpload').innerHTML
      };

      try {
        await profileManager.saveProfile(profile);
        currentProfile = profile;
        document.getElementById('profileStatus').innerHTML = '<div class="card" style="background: rgba(111, 174, 147, 0.1); border-color: rgba(111, 174, 147, 0.3); color: var(--sage);">✓ 프로필이 저장되었습니다!</div>';

        setTimeout(() => {
          document.querySelector('[data-tab="analyze"]').click();
          document.getElementById('analyzeCatName').textContent = name;
        }, 1000);
      } catch (error) {
        console.error('프로필 저장 실패:', error);
        // 폴백: localStorage
        await profileManager.saveProfileFallback(profile);
        currentProfile = profile;
      }
    }

    // 프로필 로드
    async function loadProfile() {
      try {
        const profile = await profileManager.getProfile();
        if (!profile) {
          const fallback = await profileManager.getProfileFallback();
          if (fallback) {
            currentProfile = fallback;
            loadProfileUI(fallback);
          }
        } else {
          currentProfile = profile;
          loadProfileUI(profile);
        }
      } catch (error) {
        console.error('프로필 로드 실패:', error);
      }
    }

    function loadProfileUI(profile) {
      document.getElementById('catName').value = profile.name;
      document.getElementById('catAge').value = profile.age || '';
      document.getElementById('catInfo').value = profile.info || '';
      document.getElementById('logoUpload').innerHTML = profile.photo || '🐱';

      if (profile.gender) {
        document.querySelector(`[data-gender="${profile.gender}"]`)?.classList.add('on');
      }

      if (profile.personalities) {
        profile.personalities.forEach(p => {
          document.querySelector(`[data-personality="${p}"]`)?.classList.add('on');
        });
      }
    }

    // 사진 업로드
    document.getElementById('catPhoto').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = document.createElement('img');
        img.src = evt.target.result;
        document.getElementById('logoUpload').innerHTML = '';
        document.getElementById('logoUpload').appendChild(img);
      };
      reader.readAsDataURL(file);
    });

    // 이미지 분석
    document.getElementById('analyzePhoto').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !currentProfile) {
        alert('프로필을 먼저 설정해주세요');
        return;
      }

      const reader = new FileReader();
      reader.onload = async (evt) => {
        const img = new Image();
        img.onload = async () => {
          const preview = document.createElement('img');
          preview.src = img.src;
          preview.className = 'preview-img';
          document.getElementById('analyzePreview').innerHTML = '';
          document.getElementById('analyzePreview').appendChild(preview);
          document.getElementById('analyzePreview').innerHTML += '<div class="loading"><div class="spinner"></div> YOLO 분석 중...</div>';

          try {
            const ready = await yoloDetector.waitForReady();
            if (!ready) {
              throw new Error('YOLO 모델 로드 실패');
            }

            const detectionResult = await yoloDetector.detectCat(img);
            const selectedPersonality = currentProfile.personalities?.length > 0
              ? currentProfile.personalities[0]
              : '느긋함';

            const emotion = yoloDetector.analyzeEmotion(detectionResult, selectedPersonality);

            // 대사 선택
            const personalityResponses = responses[currentLang][selectedPersonality];
            if (personalityResponses) {
              const responses_for_emotion = personalityResponses[emotion.emotion];
              if (responses_for_emotion && responses_for_emotion.length > 0) {
                lastResponse = responses_for_emotion[Math.floor(Math.random() * responses_for_emotion.length)];
              }
            }

            displayResult(
              detectionResult.hasCat ? '😸' : '😾',
              detectionResult
            );

            document.getElementById('analyzePreview').querySelector('.loading')?.remove();
          } catch (error) {
            console.error('분석 오류:', error);
            lastResponse = '분석 중 오류가 발생했습니다ㅠ';
            displayResult('😵', null);
            document.getElementById('analyzePreview').querySelector('.loading')?.remove();
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function displayResult(emoji, detection) {
      document.getElementById('emotionEmoji').textContent = emoji;
      document.getElementById('responseText').textContent = lastResponse || '분석 완료!';
      document.getElementById('charCount').textContent = `${(lastResponse || '').length} 자`;
      document.getElementById('detectionInfo').textContent =
        detection?.hasCat
          ? `고양이 감지: ${detection.catCount}마리 (신뢰도: ${detection.confidence}%)`
          : '고양이가 감지되지 않았습니다';
      document.getElementById('results').style.display = 'block';

      speakResponse();
    }

    function speakResponse() {
      const langMap = {
        ko: 'ko-KR',
        ja: 'ja-JP',
        es: 'es-ES'
      };

      const utterance = new SpeechSynthesisUtterance(lastResponse);
      utterance.lang = langMap[currentLang];
      utterance.rate = 0.9;
      utterance.pitch = Math.random() * 0.4 + 0.8;

      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    // 모델 준비
    (async () => {
      const ready = await yoloDetector.waitForReady();
      if (ready) {
        document.getElementById('modelStatus').textContent = '✓ 모델 준비 완료';
        document.getElementById('modelStatus').classList.add('ready');
      } else {
        document.getElementById('modelStatus').textContent = '⚠ 모델 로드 실패';
      }
    })();

    // 초기화
    window.addEventListener('DOMContentLoaded', () => {
      loadProfile();
    });
  </script>
</body>

</html>
